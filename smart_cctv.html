<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AegisRadar 360 - Global Live Monitor</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #050505; color: #fff; font-family: sans-serif; }
        
        #info-panel {
            position: absolute; top: 15px; left: 15px; z-index: 100;
            background: rgba(15, 15, 25, 0.9); padding: 15px 20px; border-radius: 10px;
            border: 1px solid rgba(0, 229, 255, 0.3); backdrop-filter: blur(5px);
            width: 270px;
        }
        h2 { margin: 0 0 10px 0; font-size: 1.1rem; color: #00e5ff; }
        p { margin: 4px 0; font-size: 0.85rem; }
        .coords { color: #ffea00; font-weight: bold; }
        .status-ok { color: #00ff66; font-weight: bold; }
        .status-alert { color: #ff3333; font-weight: bold; }

        .lock-indicator {
            display: inline-block; width: 12px; height: 12px; border-radius: 50%;
            margin-right: 5px; background-color: #00ff66; box-shadow: 0 0 8px #00ff66;
        }
        .lock-indicator.open { background-color: #ff3333; box-shadow: 0 0 8px #ff3333; }

        .input-group { margin-top: 8px; display: flex; justify-content: space-between; align-items: center; }
        .input-group label { font-size: 0.8rem; color: #aaa; }
        .input-group input { width: 60px; background: #111; border: 1px solid #00e5ff; color: #fff; text-align: center; border-radius: 4px; padding: 2px; }
        button { width: 100%; margin-top: 10px; background: #00e5ff; border: none; padding: 6px; border-radius: 4px; font-weight: bold; cursor: pointer; color: #000; }
        button:hover { background: #00b3cc; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
</head>
<body>
    <div id="info-panel">
        <h2>AegisRadar 360 (Global)</h2>
        <p>MQTT Status: <span id="mqtt-status" class="status-alert">Connecting...</span></p>
        <p><span id="indicator" class="lock-indicator"></span>Tamper Lock: <span id="tamper-status" class="status-ok">CLOSED (SECURE)</span></p>
        
        <hr style="border-color: rgba(255,255,255,0.1);">
        <p><b>📐 Room Dimensions (Meters):</b></p>
        <div class="input-group">
            <label>Width (X):</label>
            <input type="number" id="roomW" value="5" step="0.5">
        </div>
        <div class="input-group">
            <label>Length (Y):</label>
            <input type="number" id="roomL" value="6" step="0.5">
        </div>
        <div class="input-group">
            <label>Height (Z):</label>
            <input type="number" id="roomH" value="3" step="0.5">
        </div>
        <button onclick="updateRoomDimensions()">Apply Room</button>

        <hr style="border-color: rgba(255,255,255,0.1);">
        <p>Target Coordinates (mm):</p>
        <p class="coords">X: <span id="posX">0</span> | Y: <span id="posY">0</span> | Z: <span id="posZ">0</span></p>
    </div>

    <script>
        let scene, camera, renderer, roomBox, gridHelper, targetMesh, statusLight;
        let roomWidth = 5, roomLength = 6, roomHeight = 3;
        let lastTamperState = false;

        if (Notification.permission !== "granted") {
            Notification.requestPermission();
        }

        function init3D() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            const targetGeo = new THREE.SphereGeometry(0.25, 16, 16);
            const targetMat = new THREE.MeshBasicMaterial({ color: 0x00ff66 });
            targetMesh = new THREE.Mesh(targetGeo, targetMat);
            scene.add(targetMesh);

            const lightGeo = new THREE.SphereGeometry(0.3, 16, 16);
            const lightMat = new THREE.MeshBasicMaterial({ color: 0x00ff66 });
            statusLight = new THREE.Mesh(lightGeo, lightMat);
            scene.add(statusLight);

            createRoom(roomWidth, roomLength, roomHeight);

            camera.position.set(0, roomHeight * 2, roomLength * 1.5);
            camera.lookAt(0, 0, 0);

            animate();
        }

        function createRoom(w, l, h) {
            if (roomBox) scene.remove(roomBox);
            if (gridHelper) scene.remove(gridHelper);

            gridHelper = new THREE.GridHelper(Math.max(w, l), 10, 0x00e5ff, 0x224455);
            scene.add(gridHelper);

            const boxGeo = new THREE.BoxGeometry(w, h, l);
            const wireGeo = new THREE.WireframeGeometry(boxGeo);
            const wireMat = new THREE.LineBasicMaterial({ color: 0x00e5ff });
            roomBox = new THREE.LineSegments(wireGeo, wireMat);
            
            roomBox.position.set(0, h / 2, 0);
            scene.add(roomBox);

            statusLight.position.set(-w / 2 + 0.5, h - 0.5, -l / 2 + 0.5);
        }

        function updateRoomDimensions() {
            roomWidth = parseFloat(document.getElementById('roomW').value);
            roomLength = parseFloat(document.getElementById('roomL').value);
            roomHeight = parseFloat(document.getElementById('roomH').value);
            createRoom(roomWidth, roomLength, roomHeight);
        }

        function sendNotification(title, body) {
            if (Notification.permission === "granted") {
                new Notification(title, { body: body });
            }
        }

        // --- إعداد اتصال MQTT لـ WebSockets ---
        const topic = "aegisradar/data/ghanim";
        const clientID = "web_client_" + Math.random().toString(16).substr(2, 8);
        const mqttClient = new Paho.MQTT.Client("broker.hivemq.com", Number(8884), "/mqtt", clientID);


        mqttClient.onConnectionLost = function (responseObject) {
            document.getElementById('mqtt-status').innerText = 'Disconnected';
            document.getElementById('mqtt-status').className = 'status-alert';
        };

        mqttClient.onMessageArrived = function (message) {
            const data = JSON.parse(message.payloadString);
            
            const tamperElem = document.getElementById('tamper-status');
            const indicatorElem = document.getElementById('indicator');

            if (data.tamper) {
                tamperElem.innerText = 'OPEN (TAMPER DETECTED!)';
                tamperElem.className = 'status-alert';
                indicatorElem.classList.add('open');
                
                statusLight.material.color.setHex(0xff0000);
                targetMesh.material.color.setHex(0xff0000);
                scene.background = new THREE.Color(0x330000);

                if (!lastTamperState) {
                    sendNotification("⚠️ AegisRadar Alert", "Warning: Anti-Tamper Switch OPENED!");
                    lastTamperState = true;
                }
            } else {
                tamperElem.innerText = 'CLOSED (SECURE)';
                tamperElem.className = 'status-ok';
                indicatorElem.classList.remove('open');
                
                statusLight.material.color.setHex(0x00ff66);
                targetMesh.material.color.setHex(0x00ff66);
                scene.background = new THREE.Color(0x050505);

                if (lastTamperState) {
                    sendNotification("✅ AegisRadar Status", "Anti-Tamper Switch is now CLOSED.");
                    lastTamperState = false;
                }
            }

            const xMeter = data.x / 1000;
            const yMeter = data.y / 1000;
            const zMeter = data.z / 1000;

            document.getElementById('posX').innerText = data.x;
            document.getElementById('posY').innerText = data.y;
            document.getElementById('posZ').innerText = data.z;

            targetMesh.position.set(xMeter, zMeter, -yMeter + (roomLength / 2));
        };

        mqttClient.connect({
            useSSL: true,
            onSuccess: function () {
                document.getElementById('mqtt-status').innerText = 'Connected (Global)';
                document.getElementById('mqtt-status').className = 'status-ok';
                mqttClient.subscribe(topic);
            },
            onFailure: function (err) {
                document.getElementById('mqtt-status').innerText = 'Connection Failed';
            }
        });

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        init3D();
    </script>
</body>
</html>
