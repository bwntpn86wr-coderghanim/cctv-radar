[7/26/2026 1:54 PM] GHANIM FIRAS⚜️: <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شاشة الرادار السحابية - تتبع وتحديد الحالة</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/4.3.7/mqtt.min.js"></script>
    <style>
        body { 
            background: #0d1117; 
            color: white; 
            text-align: center; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }
        #status { 
            font-size: 15px; 
            margin: 10px auto; 
            padding: 8px 16px; 
            border-radius: 20px;
            display: inline-block;
            background: #21262d;
            border: 1px solid #30363d;
        }
        .dashboard {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 15px;
        }
        canvas { 
            background: #161b22; 
            border: 1px solid #30363d; 
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .info-card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 20px;
            min-width: 260px;
            text-align: right;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .info-item {
            margin-bottom: 15px;
        }
        .info-title {
            color: #8b949e;
            font-size: 13px;
        }
        .info-value {
            font-size: 20px;
            font-weight: bold;
            color: #00ffaa;
            margin-top: 5px;
        }
        .badge-standing { color: #3fb950; }
        .badge-sitting { color: #d29922; }
        .badge-moving { color: #58a6ff; }
        .badge-none { color: #f85149; }
    </style>
</head>
<body>

    <h2>📡 شاشة الرادار السحابية - المراقبة والتتبع المباشر</h2>
    <div id="status">جاري الاتصال بالسيرفر السحابي...</div>

    <div class="dashboard">
        <canvas id="radarCanvas" width="700" height="480"></canvas>
        
        <div class="info-card">
            <h3>📊 معلومات الهدف المباشرة</h3>
            <hr style="border-color: #30363d; margin-bottom: 15px;">
            
            <div class="info-item">
                <div class="info-title">حالة الشخص الحالي:</div>
                <div id="personState" class="info-value badge-none">غير متواجد</div>
            </div>

            <div class="info-item">
                <div class="info-title">المسافة الفعلية:</div>
                <div id="distanceVal" class="info-value">0 m</div>
            </div>

            <div class="info-item">
                <div class="info-title">الإحداثيات (X, Y):</div>
                <div id="coordsVal" class="info-value" style="font-size: 16px; color: #c9d1d9;">X: 0 | Y: 0</div>
            </div>

            <div class="info-item">
                <div class="info-title">حالة الحركة:</div>
                <div id="motionVal" class="info-value" style="font-size: 16px; color: #8b949e;">سكون</div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('radarCanvas');
        const ctx = canvas.getContext('2d');
        const statusDiv = document.getElementById('status');
        const stateEl = document.getElementById('personState');
        const distEl = document.getElementById('distanceVal');
        const coordsEl = document.getElementById('coordsVal');
        const motionEl = document.getElementById('motionVal');

        const cx = canvas.width / 2;
        const cy = canvas.height - 40;

        let target = { detected: false, x: 0, y: 0, speed: 0, pose: "NO TARGET" };
        let trail = [];

        // الاتصال بسيرفر HiveMQ عبر WSS
        const client = mqtt.connect('wss://broker.hivemq.com:8884/mqtt');
client.on('connect', () => {
    statusDiv.textContent = "متصل بالسحابة بنجاح ✅ (جاهز من أي مكان)";
    statusDiv.style.color = "#3fb950";
    client.subscribe('cctv_radar_ghanim_2026');
});
        client.on('offline', () => {
            statusDiv.textContent = "غير متصل بالسيرفر السحابي ❌";
            statusDiv.style.color = "#f85149";
        });

        client.on('message', (topic, message) => {
            try {
                target = JSON.parse(message.toString());
                updateDashboard(target);

                if (target.detected) {
                    trail.push({ x: target.x, y: target.y });
                    if (trail.length > 20) trail.shift();
                } else {
                    trail = [];
                }
            } catch (e) {
                console.error("Error parsing JSON", e);
            }
        });

        function updateDashboard(t) {
            if (!t.detected) {
                stateEl.textContent = "غير متواجد";
                stateEl.className = "info-value badge-none";
                distEl.textContent = "0 m";
                coordsEl.textContent = "X: 0 | Y: 0";
                motionEl.textContent = "لا يوجد حركة";
                return;
            }

            stateEl.textContent = t.pose;
            if (t.pose === "واقف (Standing)") {
                stateEl.className = "info-value badge-standing";
            } else if (t.pose === "جالس (Sitting)") {
                stateEl.className = "info-value badge-sitting";
            } else if (t.pose === "تحرك (Moving)") {
                stateEl.className = "info-value badge-moving";
            } else {
                stateEl.className = "info-value badge-none";
            }

            const distMeters = (Math.sqrt(t.x * t.x + t.y * t.y) / 1000).toFixed(2);
            distEl.textContent = distMeters + " m";
            coordsEl.textContent = 'X:${t.x} mm | Y:${t.y} mm';
            motionEl.textContent = t.speed > 150 ? "حركة سريعة 🏃" : "ثبات / حركة خفيفة 🚶";
        }

        function drawPersonStickman(x, y, pose, color) {
            ctx.save();
            ctx.strokeStyle = color;
            ctx.fillStyle = color;
            ctx.lineWidth = 3;
            ctx.lineCap = "round";

            if (pose === "واقف (Standing)") {
                ctx.beginPath();
                ctx.arc(x, y - 50, 6, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.moveTo(x, y - 44);
                ctx.lineTo(x, y - 20);
                ctx.moveTo(x - 12, y - 35);
                ctx.lineTo(x + 12, y - 35);
                ctx.moveTo(x, y - 20);
                ctx.lineTo(x - 8, y);
                ctx.moveTo(x, y - 20);
                ctx.lineTo(x + 8, y);
                ctx.stroke();
            } else if (pose === "جالس (Sitting)") {
                ctx.beginPath();
                ctx.arc(x - 5, y - 40, 6, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.moveTo(x - 5, y - 34);
                ctx.lineTo(x - 5, y - 15);
                ctx.moveTo(x - 5, y - 28);
                ctx.lineTo(x + 5, y - 22);
                ctx.moveTo(x - 5, y - 15);
                ctx.lineTo(x + 8, y - 15);
                ctx.lineTo(x + 8, y);
                ctx.stroke();
            } else if (pose === "تحرك (Moving)") {
                ctx.beginPath();
                ctx.arc(x + 4, y - 52, 6, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.moveTo(x + 2, y - 46);
                ctx.lineTo(x - 4, y - 22);
                ctx.moveTo(x + 1, y - 38);
                ctx.lineTo(x + 12, y - 30);
                ctx.moveTo(x + 1, y - 38);
                ctx.lineTo(x - 10, y - 42);
                ctx.moveTo(x - 4, y - 22);
                ctx.lineTo(x + 10, y - 8);
                ctx.lineTo(x + 8, y);
                ctx.moveTo(x - 4, y - 22);
                ctx.lineTo(x - 14, y - 10);
                ctx.stroke();
            }
            ctx.restore();
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.width,canvas.clientHeight);


            // 1. رسم دوائر الرادار
            ctx.strokeStyle = "rgba(0, 255, 170, 0.2)";
            ctx.lineWidth = 1;
            for (let r = 1; r <= 4; r++) {
                ctx.beginPath();
                ctx.arc(cx, cy, r * 90, Math.PI, 0);
                ctx.stroke();
            }

            // 2. رسم منطقة الخطر المقوسة باللون الأحمر (أقل من 1.5 متر)
            ctx.strokeStyle = "rgba(248, 81, 73, 0.3)";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(cx, cy, 90, Math.PI, 0);
            ctx.stroke();

            // 3. رسم المسار
            trail.forEach((p, idx) => {
                const tx = cx + (p.x / 6000) * 350;
                const ty = cy - (p.y / 6000) * 350;
                ctx.fillStyle = "rgba(0, 255, 170, " + (idx / 20) + ")";
                ctx.beginPath();
                ctx.arc(tx, ty, 3, 0, Math.PI * 2);
                ctx.fill();
            });

            // 4. رسم الهدف وهيكل الشخص
            if (target.detected) {
                const px = cx + (target.x / 6000) * 350;
                const py = cy - (target.y / 6000) * 350;

                let targetColor = "#00ffaa";
                if (target.pose === "واقف (Standing)") targetColor = "#3fb950";
                if (target.pose === "جالس (Sitting)") targetColor = "#d29922";
                if (target.pose === "تحرك (Moving)") targetColor = "#58a6ff";

                drawPersonStickman(px, py - 10, target.pose, targetColor);

                ctx.strokeStyle = targetColor;
                ctx.lineWidth = 2;
                ctx.strokeRect(px - 22, py - 22, 44, 44);

                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 13px sans-serif";
                ctx.textAlign = "center";
                ctx.fillText(target.pose, px, py - 65);
            }

            requestAnimationFrame(render);
        }

        render();
    </script>
</body>
</html>
