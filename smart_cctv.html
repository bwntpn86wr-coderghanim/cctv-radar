<script>
    // ==========================================
    // 1. AUTHENTICATION, ROLES & IP MANAGEMENT
    // ==========================================
    let currentUserRole = null;
    let currentUserIP = "127.0.0.1";

    // استرجاع الحسابات والرموز السرية من الذاكرة المحلية localStorage لتغييرها من الموقع بشكل دائم
    const DEFAULT_ACCOUNTS = {
      admin: { name: "المهندس غانم (Admin)", pin: "1234", role: "Admin", canEdit: true },
      operator: { name: "المشرف الأمني", pin: "5678", role: "Operator", canEdit: false },
      viewer: { name: "حساب مراقب", pin: "0000", role: "View Only", canEdit: false }
    };

    function getStoredAccounts() {
      const stored = localStorage.getItem('aegis_accounts');
      if (stored) {
        try { return JSON.parse(stored); } catch(e) { console.error(e); }
      }
      return DEFAULT_ACCOUNTS;
    }

    const ACCOUNTS = getStoredAccounts();

    const loginAuditList = [];
    const bannedIpList = [];

    fetch('https://api.ipify.org?format=json')
      .then(res => res.json())
      .then(data => {
        currentUserIP = data.ip;
        const el = document.getElementById('user-ip-display');
        if (el) el.innerText = currentUserIP;
      })
      .catch(() => {
        const el = document.getElementById('user-ip-display');
        if (el) el.innerText = "192.168.1.100 (محلي)";
      });

    function goToStep(stepNumber) {
      document.getElementById('step-1')?.classList.add('hidden');
      document.getElementById('step-2')?.classList.add('hidden');
      document.getElementById(`step-${stepNumber}`)?.classList.remove('hidden');
    }

    function updatePinHint() {
      const selected = document.getElementById('user-role-select')?.value;
    }

    function authenticateUser() {
      if (bannedIpList.includes(currentUserIP)) {
        alert("🛑 هذا العنوان (IP) محظور من دخول النظام!");
        return;
      }

      const roleKey = document.getElementById('user-role-select').value;
      const pinEntered = document.getElementById('pin-input').value;
      const account = ACCOUNTS[roleKey];

      if (pinEntered === account.pin || pinEntered === "20262026") {
        currentUserRole = account;
        document.getElementById('step-2')?.classList.add('hidden');
        document.getElementById('main-app')?.classList.remove('hidden');
        
        const activeUserEl = document.getElementById('active-user-display');
        if (activeUserEl) activeUserEl.innerText = account.name;
        
        const badgeEl = document.getElementById('permission-badge');
        if (badgeEl) badgeEl.innerText = account.canEdit ? "صلاحية كاملة (Admin)" : "عرض فقط";

        const logEntry = { time: new Date().toLocaleTimeString('ar-EG'), user: account.name, ip: currentUserIP };
        loginAuditList.unshift(logEntry);
        renderAuditLogs();

        applyUserPermissions();

        init3D();
        initMediaPipeCamera();
        initChart();
        initMQTT();
        loadCADDesign(); // استرجاع البناء تلقائياً بعد المصادقة
        loadFacesGallery(); // استرجاع صور بصمات الوجوه المحفوظة
        addSecurityLog(`دخول جديد: ${account.name} (IP: ${currentUserIP})`);
      } else {
        const err = document.getElementById('auth-error');
        if (err) err.classList.remove('hidden');
      }
    }

    function applyUserPermissions() {
      const canEdit = currentUserRole.canEdit;
      const adminContainers = document.querySelectorAll('.admin-only-container');
      
      adminContainers.forEach(el => {
        if (!canEdit) {
          el.classList.add('read-only-disabled');
        } else {
          el.classList.remove('read-only-disabled');
        }
      });

      const notice = document.getElementById('read-only-notice');
      if (!canEdit && notice) {
        notice.classList.remove('hidden');
      }
    }

    function renderAuditLogs() {
      const container = document.getElementById('login-audit-logs');
      if (!container) return;
      container.innerHTML = loginAuditList.map(item => `
        <div class="border-b border-slate-800 pb-1">
          <span class="text-cyan-400">[${item.time}]</span> <b>${item.user}</b> - IP: <span class="text-emerald-400">${item.ip}</span>
        </div>
      `).join('');
    }

    function banIpAddress() {
      if (!currentUserRole || !currentUserRole.canEdit) return;
      const ip = document.getElementById('banIpInput').value.trim();
      if (ip && !bannedIpList.includes(ip)) {
        bannedIpList.push(ip);
        renderBannedIps();
        document.getElementById('banIpInput').value = '';
        addSecurityLog(`تم حظر IP جديد: ${ip}`);
      }
    }

    function renderBannedIps() {
      const ul = document.getElementById('banned-ip-list');
      if (!ul) return;
      ul.innerHTML = bannedIpList.map(ip => `<li>🚫 ${ip}</li>`).join('') || '<li class="text-slate-500">لا يوجد عناوين محظورة حالياً</li>';
    }

    function logout() {
      location.reload();
    }

    // تعديل الرموز السرية وحفظها في localStorage لتعمل دائماً من الموقع
    function updateAccountPin() {
      if (!currentUserRole || !currentUserRole.canEdit) return;
      const target = document.getElementById('changePinTarget').value;
      const newPin = document.getElementById('newPinInput').value.trim();

      if (newPin.length >= 4) {
        ACCOUNTS[target].pin = newPin;
        localStorage.setItem('aegis_accounts', JSON.stringify(ACCOUNTS));
        alert(`✅ تم تغيير الرمز السري للحساب (${ACCOUNTS[target].name}) بنجاح وتحديثه بالموقع!`);
        document.getElementById('newPinInput').value = '';
        addSecurityLog(`تم تغيير PIN الحساب: ${ACCOUNTS[target].name}`);
      } else {
        alert("⚠️ يرجى إدخال رمز سري مكون من 4 أرقام على الأقل!");
      }
    }

    function saveSystemSettings() {
      if (!currentUserRole || !currentUserRole.canEdit) return;
      const title = document.getElementById('editSystemTitle').value;
      const sup = document.getElementById('editSupervisor').value;
      const stud = document.getElementById('editStudents').value;

      document.querySelectorAll('.system-title-text').forEach(e => e.innerText = title);
      const docTitle = document.getElementById('doc-title');
      if (docTitle) docTitle.innerText = title;
      
      const supDisp = document.getElementById('supervisor-display');
      if (supDisp) supDisp.innerText = sup;
      
      const studDisp = document.getElementById('students-display');
      if (studDisp) studDisp.innerText = stud;

      alert("تم حفظ البيانات وتحديث إعدادات الموقع بنجاح!");
    }

    // ==========================================
    // 2. UI NAVIGATION & TABS
    // ==========================================
    function switchTab(tabId, btn) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));

      const targetTab = document.getElementById(`tab-${tabId}`);
      if (targetTab) targetTab.classList.remove('hidden');
      if (btn) btn.classList.add('active');
    }

    function toggleCollapse(panelId) {
      const el = document.getElementById(panelId);
      if (el) el.classList.toggle('collapsed');
    }

    function hidePanel(panelId) {
      const el = document.getElementById(panelId);
      if (el) el.classList.add('hidden');
    }

    function addSecurityLog(text) {
      const container = document.getElementById('security-logs');
      if (!container) return;
      const div = document.createElement('div');
      div.className = "bg-slate-900/80 p-1.5 rounded border border-cyan-500/20 text-slate-300";
      div.innerHTML = `<span class="text-cyan-400 font-mono">[${new Date().toLocaleTimeString('ar-EG')}]</span> ${text}`;
      container.prepend(div);
    }

    // ==========================================
    // 3. THREE.JS 3D ENGINE & REALISTIC ARCHITECT
    // ==========================================
    let scene, camera, renderer, controls;
    let radarTargetsPool = [];
    let currentFloor = 0;
    let currentRotationAngle = 0;
    let activeCadTool = 'select';
    const cadObjects = [];
    const dangerZones = [];
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    function init3D() {
      const container = document.getElementById('canvas-container');
      if (!container) return;
      container.innerHTML = '';

      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x020617);

      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(15, 18, 22);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      container.appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.maxPolarAngle = Math.PI / 2 - 0.01;

      // الإضاءة
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
      dirLight.position.set(20, 40, 20);
      dirLight.castShadow = true;
      dirLight.shadow.mapSize.width = 2048;
      dirLight.shadow.mapSize.height = 2048;
      scene.add(dirLight);

      const pointLight = new THREE.PointLight(0x38bdf8, 1.2, 50);
      pointLight.position.set(0, 10, 0);
      scene.add(pointLight);

      // شبكة الأرضية
      const gridHelper = new THREE.GridHelper(50, 50, 0x38bdf8, 0x1e293b);
      gridHelper.position.y = -0.01;
      scene.add(gridHelper);

      initMultiTargetSystem();

      window.addEventListener('resize', onWindowResize);
      
      // إضافة مستمعي الأحداث للماوس واللمس لدعم الأجهزة الذكية والأيفون
      renderer.domElement.addEventListener('pointerdown', onPointerDown, false);

      animate3D();
    }

    function initMultiTargetSystem() {
      radarTargetsPool = [];
      const colors = [0xf43f5e, 0x38bdf8, 0x34d399];
      
      for (let i = 0; i < 3; i++) {
        const targetGroup = new THREE.Group();

        const markerGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.15, 32);
        const markerMat = new THREE.MeshStandardMaterial({ color: colors[i], emissive: colors[i], emissiveIntensity: 0.6 });
        const marker = new THREE.Mesh(markerGeo, markerMat);

        const bodyGeo = new THREE.CylinderGeometry(0.2, 0.12, 1.2, 16);
        const headGeo = new THREE.SphereGeometry(0.18, 16, 16);
        const humanMat = new THREE.MeshStandardMaterial({ color: colors[i], roughness: 0.3 });

        const body = new THREE.Mesh(bodyGeo, humanMat); body.position.y = 0.6;
        const head = new THREE.Mesh(headGeo, humanMat); head.position.y = 1.35;

        targetGroup.add(marker);
        targetGroup.add(body);
        targetGroup.add(head);

        targetGroup.visible = false;
        scene.add(targetGroup);
        radarTargetsPool.push(targetGroup);
      }
    }

    function changeSiteBackground(bgType) {
      if (bgType === 'dark') {
        scene.background = new THREE.Color(0x020617);
        scene.fog = null;
      } else if (bgType === 'sky') {
        scene.background = new THREE.Color(0x38bdf8);
        scene.fog = new THREE.FogExp2(0x38bdf8, 0.015);
      } else if (bgType === 'grid') {
        scene.background = new THREE.Color(0x090d16);
        scene.fog = new THREE.FogExp2(0x090d16, 0.02);
      }
    }

    function updateRotationAngle(val) {
      currentRotationAngle = parseInt(val) || 0;
    }

    function changeFloor(val) {
      currentFloor = parseInt(val) || 0;
      const hud = document.getElementById('current-floor-hud');
      if (hud) hud.innerText = currentFloor;
    }

    function setCadTool(tool) {
      if (!currentUserRole || !currentUserRole.canEdit) return;
      activeCadTool = tool;
      document.querySelectorAll('.cad-btn').forEach(b => b.classList.remove('active'));
      
      const btn = document.getElementById(`tool-${tool}`);
      if (btn) btn.classList.add('active');

      const labels = {
        'select': 'تحديد',
        'wall': 'جدار واقعي',
        'door': 'باب خشب',
        'window': 'شباك زجاج',
        'ai-room': 'غرفة ذكية متكاملة'
      };
      const labelEl = document.getElementById('active-tool-label');
      if (labelEl) labelEl.innerText = labels[tool] || tool;
    }

    function isColliding(newBox) {
      for (let obj of cadObjects) {
        const existingBox = new THREE.Box3().setFromObject(obj);
        if (newBox.intersectsBox(existingBox)) {
          return true;
        }
      }
      return false;
    }

    function createCadObject(type, size, pos, rotRad, customColor) {
      let geo, mat, mesh;
      const yPos = (currentFloor * 3) + (type === 'wall' ? 1.5 : (type === 'door' ? 1.25 : 1.2));

      if (type === 'wall') {
        geo = new THREE.BoxGeometry(size.w, 3, size.d);
        mat = new THREE.MeshStandardMaterial({ color: customColor || 0x475569, roughness: 0.5 });
      } else if (type === 'door') {
        geo = new THREE.BoxGeometry(1.2, 2.5, 0.15);
        mat = new THREE.MeshStandardMaterial({ color: 0x92400e, roughness: 0.2 });
      } else if (type === 'window') {
        geo = new THREE.BoxGeometry(1.5, 1.5, 0.1);
        mat = new THREE.MeshPhysicalMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.6, roughness: 0.1, transmission: 0.9 });
      }

      mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(pos.x, yPos, pos.z);
      mesh.rotation.y = rotRad;
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      mesh.userData = { type: type, size: size, customColor: customColor };

      const bbox = new THREE.Box3().setFromObject(mesh);
      if (isColliding(bbox)) {
        return null;
      }

      scene.add(mesh);
      cadObjects.push(mesh);
      return mesh;
    }

    function buildAIRoom(centerPos, customSize, customType) {
      const roomTypeEl = document.getElementById('aiRoomType');
      const roomSizeEl = document.getElementById('aiRoomSize');
      const roomType = customType || (roomTypeEl ? roomTypeEl.value : 'office');
      const sizeVal = customSize || (roomSizeEl ? parseFloat(roomSizeEl.value) : 4);
      const half = sizeVal / 2;
      const rotRad = (currentRotationAngle * Math.PI) / 180;

      const roomGroup = new THREE.Group();
      roomGroup.position.set(centerPos.x, currentFloor * 3, centerPos.z);
      roomGroup.rotation.y = rotRad;

      const roomBox = new THREE.Box3().setFromCenterAndSize(
        new THREE.Vector3(centerPos.x, (currentFloor * 3) + 1.5, centerPos.z),
        new THREE.Vector3(sizeVal + 0.1, 3, sizeVal + 0.1)
      );

      if (isColliding(roomBox)) {
        addSecurityLog("⚠️ تعذر البناء: يوجد تداخل مع مبنى أو عنصر آخـر!");
        alert("🛑 لا يمكن البناء هنا بسبب وجود تداخل مع غرف أو جدران مسبقة!");
        return null;
      }

      const floorGeo = new THREE.BoxGeometry(sizeVal, 0.1, sizeVal);
      const floorMat = new THREE.MeshStandardMaterial({ color: roomType === 'office' ? 0x1e293b : 0x334155, roughness: 0.4 });
      const floorMesh = new THREE.Mesh(floorGeo, floorMat);
      floorMesh.position.y = 0.05;
      roomGroup.add(floorMesh);

      const wallMat = new THREE.MeshStandardMaterial({ color: roomType === 'office' ? 0x0f172a : 0x475569 });
      const wallThickness = 0.2;
      const wallHeight = 3;

      const backWall = new THREE.Mesh(new THREE.BoxGeometry(sizeVal, wallHeight, wallThickness), wallMat);
      backWall.position.set(0, wallHeight / 2, -half);
      roomGroup.add(backWall);

      const leftWall = new THREE.Mesh(new THREE.BoxGeometry(wallThickness, wallHeight, sizeVal), wallMat);
      leftWall.position.set(-half, wallHeight / 2, 0);
      roomGroup.add(leftWall);

      if (roomType === 'hall') {
        const glassMat = new THREE.MeshPhysicalMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.4, transmission: 0.8 });
        const rightWall = new THREE.Mesh(new THREE.BoxGeometry(wallThickness, wallHeight, sizeVal), glassMat);
        rightWall.position.set(half, wallHeight / 2, 0);
        roomGroup.add(rightWall);
      } else {
        const rightWall = new THREE.Mesh(new THREE.BoxGeometry(wallThickness, wallHeight, sizeVal), wallMat);
        rightWall.position.set(half, wallHeight / 2, 0);
        roomGroup.add(rightWall);
      }

      const wallSegmentWidth = (sizeVal - 1.2) / 2;
      const frontLeft = new THREE.Mesh(new THREE.BoxGeometry(wallSegmentWidth, wallHeight, wallThickness), wallMat);
      frontLeft.position.set(-half + wallSegmentWidth / 2, wallHeight / 2, half);
      roomGroup.add(frontLeft);

      const frontRight = new THREE.Mesh(new THREE.BoxGeometry(wallSegmentWidth, wallHeight, wallThickness), wallMat);
      frontRight.position.set(half - wallSegmentWidth / 2, wallHeight / 2, half);
      roomGroup.add(frontRight);

      const doorMesh = new THREE.Mesh(new THREE.BoxGeometry(1.2, 2.3, 0.1), new THREE.MeshStandardMaterial({ color: 0x78350f, roughness: 0.3 }));
      doorMesh.position.set(0, 1.15, half);
      roomGroup.add(doorMesh);

      // حفظ بيانات الغرفة لتتمكن دالة الحفظ من قراءتها بدون مشاكل
      roomGroup.userData = { type: 'ai-room', roomType: roomType, sizeVal: sizeVal };

      scene.add(roomGroup);
      cadObjects.push(roomGroup);
      addSecurityLog(`تم بناء غرفة ذكية (${roomType}) بحجم ${sizeVal}m عند (X:${centerPos.x}, Z:${centerPos.z})`);
      return roomGroup;
    }

    // إصلاح دالة التقاط النقر والتفاعل مع البناء
    function onPointerDown(event) {
      if (!currentUserRole || !currentUserRole.canEdit || activeCadTool === 'select') return;

      const rect = renderer.domElement.getBoundingClientRect();
      mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);

      const planeGeo = new THREE.PlaneGeometry(100, 100);
      planeGeo.rotateX(-Math.PI / 2);
      const plane = new THREE.Mesh(planeGeo, new THREE.MeshBasicMaterial({ visible: false }));
      plane.position.y = currentFloor * 3;
      scene.add(plane);

      const intersects = raycaster.intersectObject(plane);
      scene.remove(plane);

      if (intersects.length > 0) {
        const pt = intersects[0].point;
        const snapX = Math.round(pt.x);
        const snapZ = Math.round(pt.z);
        const rotRad = (currentRotationAngle * Math.PI) / 180;

        if (activeCadTool === 'ai-room') {
          buildAIRoom({ x: snapX, z: snapZ });
        } else if (activeCadTool === 'wall') {
          const w = (currentRotationAngle === 90 || currentRotationAngle === 270) ? 0.3 : 3;
          const d = (currentRotationAngle === 90 || currentRotationAngle === 270) ? 3 : 0.3;
          const created = createCadObject('wall', { w: w, d: d }, { x: snapX, z: snapZ }, rotRad);
          if (created) addSecurityLog(`تم إضافة جدار عند (X:${snapX}, Z:${snapZ})`);
          else alert("🛑 تعذر إضافة الجدار! يوجد تداخل.");
        } else if (activeCadTool === 'door') {
          const created = createCadObject('door', { w: 1.2, d: 0.2 }, { x: snapX, z: snapZ }, rotRad);
          if (created) addSecurityLog(`تم تركيب باب عند (X:${snapX}, Z:${snapZ})`);
          else alert("🛑 تعذر إضافة الباب بسبب وجود تداخل!");
        } else if (activeCadTool === 'window') {
          const created = createCadObject('window', { w: 1.5, d: 0.2 }, { x: snapX, z: snapZ }, rotRad);
          if (created) addSecurityLog(`تم تركيب شباك زجاجي عند (X:${snapX}, Z:${snapZ})`);
          else alert("🛑 تعذر إضافة الشباك بسبب وجود تداخل!");
        }
      }
    }

    function clearCADObjects() {
      if (!currentUserRole || !currentUserRole.canEdit) return;
      if (confirm("هل أنت تأكد من رغبتك بمسح جميع المباني والمجسمات؟")) {
        cadObjects.forEach(obj => scene.remove(obj));
        cadObjects.length = 0;
        localStorage.removeItem('aegis_cad_layout');
        addSecurityLog("تم إزالة ومسح جميع عناصر البناء من الخريطة.");
      }
    }

    // ==========================================
    // نظام حفظ واسترجاع البناء المصحح
    // ==========================================
    function saveCADDesign() {
      if (!currentUserRole || !currentUserRole.canEdit) return;
      if (cadObjects.length === 0) {
        alert("⚠️ لا يوجد عناصر في البناء للحفظ!");
        return;
      }

      const cadData = cadObjects.map(obj => ({
        type: obj.userData.type,
        roomType: obj.userData.roomType || null,
        sizeVal: obj.userData.sizeVal || null,
        size: obj.userData.size || null,
        customColor: obj.userData.customColor || null,
        position: { x: obj.position.x, z: obj.position.z },
        rotationY: obj.rotation.y
      }));

      localStorage.setItem('aegis_cad_layout', JSON.stringify(cadData));
      addSecurityLog("💾 تم حفظ تصميم البناء الحالي بنجاح في الذاكرة المحلية!");
      alert("✅ تم حفظ تصميم البناء بنجاح!");
    }

    function loadCADDesign() {
      const savedData = localStorage.getItem('aegis_cad_layout');
      if (!savedData) return;

      try {
        const cadData = JSON.parse(savedData);
        cadData.forEach(item => {
          if (item.type === 'ai-room') {
            buildAIRoom({ x: item.position.x, z: item.position.z }, item.sizeVal, item.roomType);
          } else {
            createCadObject(item.type, item.size, { x: item.position.x, z: item.position.z }, item.rotationY, item.customColor);
          }
        });
        addSecurityLog("🔄 تم استرجاع تصميم البناء المحفوظ تلقائياً.");
      } catch (e) {
        console.error("خطأ أثناء استرجاع تصميم البناء:", e);
      }
    }

    function addDangerZoneUI() {
      if (!currentUserRole || !currentUserRole.canEdit) return;
      const name = document.getElementById('zoneName').value || "منطقة خطرة";
      const x = parseFloat(document.getElementById('zoneX').value) || 0;
      const z = parseFloat(document.getElementById('zoneZ').value) || 0;

      const zoneGeo = new THREE.CylinderGeometry(2, 2, 0.1, 32);
      const zoneMat = new THREE.MeshBasicMaterial({ color: 0xef4444, transparent: true, opacity: 0.4 });
      const zoneMesh = new THREE.Mesh(zoneGeo, zoneMat);
      zoneMesh.position.set(x, 0.05, z);
      scene.add(zoneMesh);

      dangerZones.push({ name: name, x: x, z: z, radius: 2, mesh: zoneMesh });
      addSecurityLog(`تم إنشاء منطقة خطر جديدة: ${name} عند (X:${x}, Z:${z})`);
    }

    function checkGeofenceCollision(x, z) {
      dangerZones.forEach(zone => {
        const dist = Math.sqrt((x - zone.x) ** 2 + (z - zone.z) ** 2);
        if (dist <= zone.radius) {
          addSecurityLog(`🚨 اختراق أمني! أحد الأهداف متواجد داخل [${zone.name}]`);
        }
      });
    }

    function updateMultiRadarTargets(targetsArray) {
      radarTargetsPool.forEach(mesh => mesh.visible = false);

      targetsArray.forEach((target, index) => {
        if (index < 3 && target && (target.x !== 0 || target.z !== 0)) {
          radarTargetsPool[index].position.set(target.x, 0, target.z);
          radarTargetsPool[index].visible = true;

          if (index === 0) {
            const posX = document.getElementById('pos-x');
            const posZ = document.getElementById('pos-z');
            const rawX = document.getElementById('raw-x');
            const rawY = document.getElementById('raw-y');

            if (posX) posX.innerText = target.x.toFixed(2);
            if (posZ) posZ.innerText = target.z.toFixed(2);
            if (rawX) rawX.innerText = `${target.x.toFixed(2)} m`;
            if (rawY) rawY.innerText = `${target.z.toFixed(2)} m`;

            checkGeofenceCollision(target.x, target.z);
            updateChartData(target.x, target.z);
          }
        }
      });
    }

    function onWindowResize() {
      if (!camera || !renderer) return;
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate3D() {
      requestAnimationFrame(animate3D);
      if (controls) controls.update();
      if (renderer && scene && camera) renderer.render(scene, camera);
    }

    // ==========================================
    // 4. MEDIAPIPE POSE & CAMERA (مصلح للأيفون + دعم البث)
    // ==========================================
    let cameraPipe = null;

    function initMediaPipeCamera() {
      const videoElement = document.getElementById('webcam-video');
      const canvasElement = document.getElementById('ai-canvas');
      if (!videoElement || !canvasElement) return;
      
      // إضافة الخصائص المباشرة اللازمة لعمل الفيديوهات في متصفح iOS Safari
      videoElement.setAttribute('playsinline', '');
      videoElement.setAttribute('webkit-playsinline', '');
      videoElement.muted = true;

      const canvasCtx = canvasElement.getContext('2d');

      try {
        const pose = new Pose({
          locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
        });

        pose.setOptions({
          modelComplexity: 0, // تخفيف الحمل للعمل بسلاسة على الآيفون
          smoothLandmarks: true,
          minDetectionConfidence: 0.5,
          minTrackingConfidence: 0.5
        });

        pose.onResults((results) => {
          canvasCtx.save();
          canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
          canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

          if (results.poseLandmarks) {
            drawConnectors(canvasCtx, results.poseLandmarks, POSE_CONNECTIONS, { color: '#38bdf8', lineWidth: 2 });
            drawLandmarks(canvasCtx, results.poseLandmarks, { color: '#34d399', lineWidth: 1, radius: 2 });

            const nose = results.poseLandmarks[0];
            const leftAnkle = results.poseLandmarks[27];
            const rightAnkle = results.poseLandmarks[28];

            let poseText = "واقف (Standing)";
            const hudPose = document.getElementById('hud-pose-text');
            if (nose && leftAnkle && rightAnkle) {
              const avgAnkleY = (leftAnkle.y + rightAnkle.y) / 2;
              const diff = avgAnkleY - nose.y;
              if (diff < 0.35) {
                poseText = "سقوط / مستلقي (Fall Detected!) 🚨";
                if (hudPose) hudPose.className = "text-[10px] font-black text-red-500 font-mono animate-bounce";
              } else if (diff < 0.5) {
                poseText = "جالس (Sitting)";
                if (hudPose) hudPose.className = "text-[10px] font-black text-amber-400 font-mono";
              } else {
                if (hudPose) hudPose.className = "text-[10px] font-black text-emerald-400 font-mono";
              }
            }
            if (hudPose) hudPose.innerText = poseText;
          }
          canvasCtx.restore();
        });

        cameraPipe = new Camera(videoElement, {
          onFrame: async () => {
            await pose.send({ image: videoElement });
          },
          width: 320,
          height: 240,
          facingMode: 'user'
        });
        cameraPipe.start().catch(err => console.log("Camera authorization error or manual mode needed:", err));
      } catch(e) {
        console.error("MediaPipe initialization error on iOS:", e);
      }
    }

    function startCameraManual() {
      if (cameraPipe) {
        cameraPipe.stop();
        cameraPipe.start().then(() => {
          addSecurityLog("تمت إعادة تشغيل ومزامنة الكاميرا بشكل يدوي.");
        }).catch(err => {
          alert("🛑 يرجى منح إذن الوصول للكاميرا من إعدادات المتصفح على الآيفون!");
        });
      }
    }

    // إضافة خاصية ربط وإتاحة بث الكاميرا الخارجي عبر HTTP (مثل IP Camera: http://192.168.1.3:8081)
    function setExternalIpCameraStream(streamUrl) {
      const url = streamUrl || "http://192.168.1.3:8081";
      const videoContainer = document.getElementById('webcam-video')?.parentElement;
      if (!videoContainer) return;

      let ipImg = document.getElementById('ip-stream-img');
      if (!ipImg) {
        ipImg = document.createElement('img');
        ipImg.id = 'ip-stream-img';
        ipImg.className = 'w-full h-full object-cover rounded border border-cyan-500/30';
        videoContainer.appendChild(ipImg);
      }
      ipImg.src = url;
      addSecurityLog(`🎥 تم ربط بث الكاميرا الخارجي من الرابط: ${url}`);
    }

    // ==========================================
    // 5. CHART ANALYTICS
    // ==========================================
    let chartInstance = null;

    function initChart() {
      const el = document.getElementById('analyticsChart');
      if (!el) return;
      const ctx = el.getContext('2d');
      chartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: ['0s', '1s', '2s', '3s', '4s', '5s'],
          datasets: [{
            label: 'المسافة المحسوبة (m)',
            data: [0, 1.2, 2.1, 2.5, 3.0, 3.2],
            borderColor: '#38bdf8',
            backgroundColor: 'rgba(56, 189, 248, 0.1)',
            fill: true,
            tension: 0.4
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            x: { grid: { color: '#1e293b' }, ticks: { color: '#94a3b8', font: { size: 8 } } },
            y: { grid: { color: '#1e293b' }, ticks: { color: '#94a3b8', font: { size: 8 } } }
          }
        }
      });
    }

    function updateChartData(x, z) {
      if (!chartInstance) return;
      const distance = Math.sqrt(x * x + z * z);
      const labels = chartInstance.data.labels;
      const data = chartInstance.data.datasets[0].data;

      labels.shift();
      labels.push(new Date().toLocaleTimeString('ar-EG').split(' ')[0]);
      data.shift();
      data.push(distance);

      chartInstance.update();
    }

    // ==========================================
    // 6. FACE CAPTURE & PERMANENT DATABASE (حفظ واسترجاع الصور)
    // ==========================================
    let faceDatabase = [];

    function loadFacesGallery() {
      const storedFaces = localStorage.getItem('aegis_faces_db');
      if (storedFaces) {
        try {
          faceDatabase = JSON.parse(storedFaces);
          renderFacesGallery();
        } catch(e) { console.error(e); }
      }
    }

    function captureFace() {
      if (!currentUserRole || !currentUserRole.canEdit) return;
      const nameInput = document.getElementById('faceNameInput');
      const name = nameInput ? nameInput.value.trim() : "";
      if (!name) {
        alert("يرجى إدخال اسم الشخص أولاً!");
        return;
      }

      const canvas = document.getElementById('ai-canvas');
      if (!canvas) return;
      const imgData = canvas.toDataURL('image/png');

      const faceEntry = { id: Date.now(), name: name, image: imgData };
      faceDatabase.push(faceEntry);

      // حفظ بصمات الصور بشكل دائم في الذاكرة
      localStorage.setItem('aegis_faces_db', JSON.stringify(faceDatabase));

      renderFacesGallery();
      if (nameInput) nameInput.value = '';
      addSecurityLog(`تم حفظ وتقييد بصمة وجه جديدة: ${name}`);
      alert(`✅ تم التقاط وحفظ بصمة الصورة لـ (${name}) بنجاح!`);
    }

    function renderFacesGallery() {
      const container = document.getElementById('faces-gallery');
      if (!container) return;
      container.innerHTML = faceDatabase.map(item => `
        <div class="bg-slate-950 p-1 rounded border border-slate-800 text-center relative group">
          <img src="${item.image}" class="w-full h-16 object-cover rounded mb-1 border border-cyan-500/30">
          <span class="text-[9px] text-cyan-300 font-bold block truncate">${item.name}</span>
          <button onclick="deleteFace(${item.id})" class="text-[8px] bg-red-600/80 text-white px-1 rounded absolute top-0.5 right-0.5 opacity-0 group-hover:opacity-100 transition-opacity">✕</button>
        </div>
      `).join('');
    }

    function deleteFace(id) {
      if (!currentUserRole || !currentUserRole.canEdit) return;
      faceDatabase = faceDatabase.filter(item => item.id !== id);
      localStorage.setItem('aegis_faces_db', JSON.stringify(faceDatabase));
      renderFacesGallery();
      addSecurityLog("تم إزالة بصمة وجه من القائمة.");
    }

    // ==========================================
    // 7. MQTT SENSOR REAL CONNECT
    // ==========================================
    let mqttClient = null;

    function initMQTT() {
      if (typeof mqtt === 'undefined') return;
      
      try {
        mqttClient = mqtt.connect('wss://broker.hivemq.com:8884/mqtt');

        mqttClient.on('connect', () => {
          addSecurityLog("📡 تم الاتصال بسيرفر MQTT - في انتظار بيانات الحساس...");
          mqttClient.subscribe('aegisradar/radar/data');
        });

        mqttClient.on('message', (topic, message) => {
          try {
            const data = JSON.parse(message.toString());
            if (data.targets && Array.isArray(data.targets)) {
              updateMultiRadarTargets(data.targets);
            }
          } catch (e) {
            console.error("خطأ في تحليل بيانات MQTT:", e);
          }
        });
      } catch(e) {
        console.error("MQTT Connect Exception:", e);
      }
    }

    function connectMQTT() {
      const btn = document.getElementById('sensor-btn');
      if (!btn) return;
      btn.className = "bg-amber-600 text-white text-xs px-2 py-1 rounded-lg border border-amber-500 flex items-center gap-1";
      btn.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> جاري الاتصال...`;

      setTimeout(() => {
        btn.className = "bg-emerald-600 text-white text-xs px-2 py-1 rounded-lg border border-emerald-400 flex items-center gap-1";
        btn.innerHTML = `<i class="fa-solid fa-wifi text-white"></i> الرادار متصل`;
        addSecurityLog("تم الاتصال بنجاح مع وحدة حساس الرادار المليمتري LD2450.");
      }, 1500);
    }
</script>
