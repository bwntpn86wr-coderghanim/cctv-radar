<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AegisRadar 360 AI - CAD & Live Stream System</title>
    <!-- Three.js Visualizer -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body { margin: 0; overflow: hidden; background-color: #0b0f19; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #fff; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        .hud-panel { position: absolute; z-index: 10; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37); }
        .cad-btn { transition: all 0.2s ease; border: 1px solid rgba(255, 255, 255, 0.15); }
        .cad-btn.active { background-color: #2563eb !important; border-color: #60a5fa !important; box-shadow: 0 0 12px rgba(37, 99, 235, 0.6); }
        /* Coordinate HUD Overlay */
        #coord-bar { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 20; font-family: monospace; }
        /* Camera Feed Overlay */
        #cam-stream-box { position: absolute; top: 80px; left: 20px; width: 320px; height: 240px; z-index: 15; overflow: hidden; }
        #camera-feed { width: 100%; height: 100%; object-fit: cover; border-radius: 8px; background: #000; }
    </style>
</head>
<body>

    <!-- Three.js 3D Viewport -->
    <div id="canvas-container"></div>

    <!-- Header Control Bar -->
    <div class="hud-panel top-4 right-4 left-4 p-3 flex justify-between items-center">
        <div class="flex items-center space-x-3 space-x-reverse">
            <div class="bg-blue-600 p-2 rounded-lg"><i class="fa-solid fa-radar text-xl"></i></div>
            <div>
                <h1 class="font-bold text-lg leading-tight">AegisRadar 360 AI</h1>
                <p class="text-xs text-gray-400">نظام الرادار والتصميم التفاعلي بأسلوب CAD</p>
            </div>
        </div>

        <!-- CAD Tools Selector -->
        <div class="flex items-center space-x-2 space-x-reverse bg-slate-900/80 p-1.5 rounded-lg border border-slate-700">
            <button id="tool-select" onclick="setCadTool('select')" class="cad-btn active px-3 py-1.5 rounded text-xs font-semibold flex items-center gap-1.5"><i class="fa-solid fa-hand-pointer"></i> تحديد</button>
            <button id="tool-wall" onclick="setCadTool('wall')" class="cad-btn px-3 py-1.5 rounded text-xs font-semibold flex items-center gap-1.5"><i class="fa-solid fa-ruler-combined"></i> رسم جدار (ماوس)</button>
            <button id="tool-zone" onclick="setCadTool('zone')" class="cad-btn px-3 py-1.5 rounded text-xs font-semibold flex items-center gap-1.5"><i class="fa-solid fa-draw-polygon"></i> منطقة خطر (ماوس)</button>
            <button id="tool-clear" onclick="clearCADObjects()" class="cad-btn bg-red-900/40 hover:bg-red-800 text-red-200 px-3 py-1.5 rounded text-xs font-semibold"><i class="fa-solid fa-trash"></i> مسح البناء</button>
        </div>

        <!-- Status & Connectivity -->
        <div class="flex items-center gap-4">
            <div class="flex items-center gap-2">
                <span class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse" id="sensor-dot"></span>
                <span class="text-xs text-gray-300" id="sensor-status">الحساس: متصل (LD2450)</span>
            </div>
            <button onclick="toggleSensorSimulation()" class="bg-slate-700 hover:bg-slate-600 text-xs px-3 py-1.5 rounded border border-slate-500">محاكاة/إيقاف الرادار</button>
        </div>
    </div>

    <!-- Live iPhone Video Stream Panel -->
    <div id="cam-stream-box" class="hud-panel p-2 flex flex-col justify-between">
        <div class="flex justify-between items-center mb-1">
            <span class="text-xs font-bold text-gray-200"><i class="fa-solid fa-video text-red-500 mr-1"></i> بث الآيفون المباشر</span>
            <span id="stream-indicator" class="text-[10px] bg-emerald-900 text-emerald-300 px-1.5 py-0.5 rounded">متصل</span>
        </div>
        
        <!-- Live Image Feed Handler -->
        <div class="relative w-full h-full bg-black rounded overflow-hidden flex items-center justify-center">
            <img id="camera-feed" src="http://192.168.1.3:8081/video" alt="iPhone Stream" onerror="handleStreamError(this)" />
            <div id="stream-fallback" class="hidden absolute inset-0 bg-slate-900/90 flex flex-col items-center justify-center p-2 text-center">
                <i class="fa-solid fa-triangle-exclamation text-amber-400 text-2xl mb-1"></i>
                <p class="text-[11px] text-gray-300">لم يتم الاتصال بالآيفون عبر HTTP</p>
                <button onclick="reconnectStream()" class="mt-2 bg-blue-600 hover:bg-blue-500 text-[10px] px-2 py-1 rounded">إعادة الاتصال</button>
            </div>
        </div>

        <div class="mt-2 flex gap-1">
            <input type="text" id="stream-url-input" value="http://192.168.1.3:8081" class="bg-slate-900 border border-slate-700 text-[11px] p-1 rounded w-full text-center text-blue-300 font-mono" />
            <button onclick="updateStreamUrl()" class="bg-blue-600 hover:bg-blue-500 text-xs px-2 rounded">حفظ</button>
        </div>
    </div>

    <!-- Realtime CAD Coordinates HUD Bar -->
    <div id="coord-bar" class="hud-panel px-6 py-2 flex items-center gap-6 text-xs text-slate-300 border border-blue-500/30">
        <div><i class="fa-solid fa-location-crosshairs text-blue-400 mr-1"></i> X: <span id="pos-x" class="text-white font-bold">0.00</span> م</div>
        <div><i class="fa-solid fa-up-down text-emerald-400 mr-1"></i> Z (Y): <span id="pos-z" class="text-white font-bold">0.00</span> م</div>
        <div><i class="fa-solid fa-ruler text-purple-400 mr-1"></i> البعد عن الرادار: <span id="pos-dist" class="text-white font-bold">0.00</span> م</div>
        <div class="border-r border-slate-700 pr-4">الأداة: <span id="active-tool-label" class="text-amber-400 font-bold">التحديد</span></div>
    </div>

    <script>
        // ==========================================
        // 1. THREE.JS SCENE SETUP & CAD GRID
        // ==========================================
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0b0f19);
        scene.fog = new THREE.FogExp2(0x0b0f19, 0.015);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 15, 15);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // Lights
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);

        // CAD Grid Ground
        const gridHelper = new THREE.GridHelper(40, 40, 0x3b82f6, 0x1e293b);
        gridHelper.position.y = 0;
        scene.add(gridHelper);

        // Interactive Invisible Ground Plane for Raycasting
        const raycastPlane = new THREE.Mesh(
            new THREE.PlaneGeometry(100, 100),
            new THREE.MeshBasicMaterial({ visible: false })
        );
        raycastPlane.rotation.x = -Math.PI / 2;
        scene.add(raycastPlane);

        // Radar Visualizer Origin Point
        const radarGeo = new THREE.CylinderGeometry(0.3, 0.3, 0.2, 32);
        const radarMat = new THREE.MeshStandardMaterial({ color: 0xef4444, emissive: 0x991b1b });
        const radarOrigin = new THREE.Mesh(radarGeo, radarMat);
        radarOrigin.position.set(0, 0.1, 0);
        scene.add(radarOrigin);

        // Radar Target Object
        const targetGeo = new THREE.SphereGeometry(0.35, 16, 16);
        const targetMat = new THREE.MeshStandardMaterial({ color: 0x22c55e, emissive: 0x15803d });
        const radarTarget = new THREE.Mesh(targetGeo, targetMat);
        radarTarget.position.set(2, 0.35, -3);
        scene.add(radarTarget);

        // ==========================================
        // 2. CAD MOUSE BUILDING SYSTEM (AutoCAD Style)
        // ==========================================
        let activeTool = 'select'; // 'select', 'wall', 'zone'
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        let isDrawing = false;
        let drawStartPoint = null;
        let previewMesh = null;

        const builtWalls = [];
        const zonePoints = [];
        let activeZoneLine = null;

        function setCadTool(tool) {
            activeTool = tool;
            document.querySelectorAll('.cad-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`tool-${tool}`).classList.add('active');
            document.getElementById('active-tool-label').innerText = 
                tool === 'wall' ? 'رسم جدار' : tool === 'zone' ? 'رسم منطقة خطر' : 'التحديد';

            // Disable orbit controls when drawing to allow smooth CAD dragging
            controls.enabled = (tool === 'select');
            resetBuildingState();
        }

        function resetBuildingState() {
            isDrawing = false;
            drawStartPoint = null;
            if(previewMesh) { scene.remove(previewMesh); previewMesh = null; }
            zonePoints.length = 0;
            if(activeZoneLine) { scene.remove(activeZoneLine); activeZoneLine = null; }
        }

        // Mouse Events for Drawing
        window.addEventListener('mousemove', onPointerMove);
        window.addEventListener('click', onPointerClick);
        window.addEventListener('dblclick', onPointerDblClick);

        function getIntersectionPoint(e) {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(raycastPlane);
            return intersects.length > 0 ? intersects[0].point : null;
        }

        function onPointerMove(e) {
            const pt = getIntersectionPoint(e);
            if (!pt) return;

            // Update Coordinates HUD
            document.getElementById('pos-x').innerText = pt.x.toFixed(2);
            document.getElementById('pos-z').innerText = pt.z.toFixed(2);
            document.getElementById('pos-dist').innerText = Math.sqrt(pt.x*pt.x + pt.z*pt.z).toFixed(2);

            // Wall Drawing Preview
            if (activeTool === 'wall' && isDrawing && drawStartPoint) {
                if (previewMesh) scene.remove(previewMesh);

                const dx = pt.x - drawStartPoint.x;
                const dz = pt.z - drawStartPoint.z;
                const distance = Math.sqrt(dx * dx + dz * dz);

                if(distance > 0.1) {
                    const wallGeo = new THREE.BoxGeometry(0.2, 1.5, distance);
                    const wallMat = new THREE.MeshStandardMaterial({ color: 0x3b82f6, transparent: true, opacity: 0.6 });
                    previewMesh = new THREE.Mesh(wallGeo, wallMat);

                    // Position and Rotate Mesh
                    previewMesh.position.set((drawStartPoint.x + pt.x)/2, 0.75, (drawStartPoint.z + pt.z)/2);
                    previewMesh.rotation.y = Math.atan2(dx, dz);
                    scene.add(previewMesh);
                }
            }
        }

        function onPointerClick(e) {
            if (e.target.closest('.hud-panel')) return; // Ignore HUD clicks
            const pt = getIntersectionPoint(e);
            if (!pt) return;

            if (activeTool === 'wall') {
                if (!isDrawing) {
                    isDrawing = true;
                    drawStartPoint = pt.clone();
                } else {
                    // Finalize Wall
                    const dx = pt.x - drawStartPoint.x;
                    const dz = pt.z - drawStartPoint.z;
                    const distance = Math.sqrt(dx * dx + dz * dz);

                    if (distance > 0.2) {
                        const wallGeo = new THREE.BoxGeometry(0.2, 1.5, distance);
                        const wallMat = new THREE.MeshStandardMaterial({ color: 0x64748b, roughness: 0.4 });
                        const finalWall = new THREE.Mesh(wallGeo, wallMat);

                        finalWall.position.set((drawStartPoint.x + pt.x)/2, 0.75, (drawStartPoint.z + pt.z)/2);
                        finalWall.rotation.y = Math.atan2(dx, dz);
                        scene.add(finalWall);
                        builtWalls.push(finalWall);
                    }

                    resetBuildingState();
                }
            } else if (activeTool === 'zone') {
                zonePoints.push(pt.clone());
                updateZoneLinePreview();
            }
        }

        function updateZoneLinePreview() {
            if (activeZoneLine) scene.remove(activeZoneLine);
            if (zonePoints.length < 2) return;

            const pts = zonePoints.map(p => new THREE.Vector3(p.x, 0.05, p.z));
            const lineGeo = new THREE.BufferGeometry().setFromPoints(pts);
            const lineMat = new THREE.LineBasicMaterial({ color: 0xef4444, linewidth: 3 });
            activeZoneLine = new THREE.Line(lineGeo, lineMat);
            scene.add(activeZoneLine);
        }

        function onPointerDblClick(e) {
            if (activeTool === 'zone' && zonePoints.length >= 3) {
                // Complete Polygon Zone Fill
                const shape = new THREE.Shape();
                shape.moveTo(zonePoints[0].x, zonePoints[0].z);
                for(let i=1; i<zonePoints.length; i++) {
                    shape.lineTo(zonePoints[i].x, zonePoints[i].z);
                }
                shape.lineTo(zonePoints[0].x, zonePoints[0].z);

                const shapeGeo = new THREE.ShapeGeometry(shape);
                const zoneMat = new THREE.MeshBasicMaterial({ color: 0xef4444, transparent: true, opacity: 0.35, side: THREE.DoubleSide });
                const zoneMesh = new THREE.Mesh(shapeGeo, zoneMat);
                zoneMesh.rotation.x = Math.PI / 2;
                zoneMesh.position.y = 0.02;
                scene.add(zoneMesh);

                resetBuildingState();
            }
        }

        function clearCADObjects() {
            builtWalls.forEach(w => scene.remove(w));
            builtWalls.length = 0;
            resetBuildingState();
        }

        // ==========================================
        // 3. IPHONE STREAM ENGINE (http://192.168.1.3:8081)
        // ==========================================
        function updateStreamUrl() {
            const url = document.getElementById('stream-url-input').value.trim();
            const img = document.getElementById('camera-feed');
            
            // Try standard endpoints if initial route fails
            img.src = url.endsWith('/video') || url.endsWith('/live') ? url : `${url}/video`;
            document.getElementById('stream-fallback').classList.add('hidden');
            document.getElementById('stream-indicator').innerText = "جاري الاتصال...";
            document.getElementById('stream-indicator').className = "text-[10px] bg-amber-900 text-amber-300 px-1.5 py-0.5 rounded";
        }

        function handleStreamError(img) {
            const currentSrc = img.src;
            // Fallback endpoints for various iOS IP Cam apps
            if (currentSrc.endsWith('/video')) {
                img.src = currentSrc.replace('/video', '/live');
            } else if (currentSrc.endsWith('/live')) {
                img.src = currentSrc.replace('/live', '/shot.jpg');
            } else {
                document.getElementById('stream-fallback').classList.remove('hidden');
                document.getElementById('stream-indicator').innerText = "متوقف";
                document.getElementById('stream-indicator').className = "text-[10px] bg-red-900 text-red-300 px-1.5 py-0.5 rounded";
            }
        }

        function reconnectStream() {
            document.getElementById('stream-fallback').classList.add('hidden');
            updateStreamUrl();
        }

        // ==========================================
        // 4. RADAR LD2450 REAL-TIME SIMULATION
        // ==========================================
        let simActive = true;
        let simAngle = 0;

        function toggleSensorSimulation() {
            simActive = !simActive;
            const dot = document.getElementById('sensor-dot');
            const status = document.getElementById('sensor-status');

            if (simActive) {
                dot.className = "w-3 h-3 rounded-full bg-emerald-500 animate-pulse";
                status.innerText = "الحساس: متصل (LD2450)";
            } else {
                dot.className = "w-3 h-3 rounded-full bg-red-500";
                status.innerText = "الحساس: متوقف";
            }
        }

        function updateRadarPosition() {
            if (!simActive) return;

            simAngle += 0.02;
            const radius = 3.5;
            radarTarget.position.x = Math.sin(simAngle) * radius;
            radarTarget.position.z = -Math.abs(Math.cos(simAngle) * radius) - 0.5;
        }

        // ==========================================
        // 5. ANIMATION LOOP & RESIZE HANDLER
        // ==========================================
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            updateRadarPosition();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Initialize Animation Loop
        animate();
    </script>
</body>
</html>
